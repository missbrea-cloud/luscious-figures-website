backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - label: "Luscious Figures Website"
    name: "website"
    files:
      - label: "Website Content"
        name: "content"
        file: "content.json"
        format: "json"
        fields:

          - label: "Business Information"
            name: "business"
            widget: "object"
            fields:
              - { label: "Business Name", name: "name", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Phone Number", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "Booking Link", name: "booking_url", widget: "string" }
              - label: "Social Media"
                name: "social_media"
                widget: "object"
                fields:
                  - { label: "Facebook", name: "Facebook", widget: "string" }
                  - { label: "Instagram", name: "Instagram", widget: "string" }
                  - { label: "Google", name: "Google", widget: "string" }

          - label: "Homepage"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Top Text", name: "eyebrow", widget: "string" }
              - { label: "Main Headline", name: "headline", widget: "string" }
              - { label: "Subheadline", name: "subheadline", widget: "text" }
              - { label: "Announcement", name: "announcement", widget: "string" }

          - label: "Services & Prices"
            name: "services"
            widget: "list"
            fields:
              - { label: "Service Name", name: "name", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
